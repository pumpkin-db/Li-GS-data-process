# ETH3D 场景配置文件
# 每个场景需要指定以下路径：
# - scan: 激光扫描点云文件 (.ply)
# - images: 去畸变图像目录
# - cameras: COLMAP cameras.txt 路径
# - images_txt: COLMAP images.txt 路径

scenes:
  # ==================== courtyard 场景 ====================
  courtyard:
    # 激光扫描点云
    scan: "D:/ETH3D/courtyard_scan_clean/courtyard/scan_clean/scan1.ply"
    # 去畸变图像目录
    images: "D:/ETH3D/courtyard_dslr_undistorted/courtyard/images/dslr_images_undistorted"
    # COLMAP 相机参数
    cameras: "D:/ETH3D/courtyard_dslr_undistorted/courtyard/dslr_calibration_undistorted/cameras.txt"
    # COLMAP 图像位姿
    images_txt: "D:/ETH3D/courtyard_dslr_undistorted/courtyard/dslr_calibration_undistorted/images.txt"
    # 图像尺寸（可选，默认从 cameras.txt 读取）
    # width: 6048
    # height: 4032

  # ==================== facade 场景 ====================
  facade:
    scan: "D:/ETH3D/facade_scan_clean/facade/scan_clean/scan1.ply"
    images: "D:/ETH3D/facade_dslr_undistorted/facade/images/dslr_images_undistorted"
    cameras: "D:/ETH3D/facade_dslr_undistorted/facade/dslr_calibration_undistorted/cameras.txt"
    images_txt: "D:/ETH3D/facade_dslr_undistorted/facade/dslr_calibration_undistorted/images.txt"

  # ==================== terrains 场景 ====================
  terrains:
    scan: "D:/ETH3D/terrains_scan_clean/terrains/scan_clean/scan1.ply"
    images: "D:/ETH3D/terrains_dslr_undistorted/terrains/images/dslr_images_undistorted"
    cameras: "D:/ETH3D/terrains_dslr_undistorted/terrains/dslr_calibration_undistorted/cameras.txt"
    images_txt: "D:/ETH3D/terrains_dslr_undistorted/terrains/dslr_calibration_undistorted/images.txt"

# ==================== 添加新场景示例 ====================
# 如果要添加新场景，按照以下格式添加：
#
#   new_scene_name:
#     scan: "D:/ETH3D/new_scene_scan_clean/new_scene/scan_clean/scan1.ply"
#     images: "D:/ETH3D/new_scene_dslr_undistorted/new_scene/images/dslr_images_undistorted"
#     cameras: "D:/ETH3D/new_scene_dslr_undistorted/new_scene/dslr_calibration_undistorted/cameras.txt"
#     images_txt: "D:/ETH3D/new_scene_dslr_undistorted/new_scene/dslr_calibration_undistorted/images.txt"
#
# 然后运行：
#   python run_filtering_eth3d.py --scene new_scene_name
